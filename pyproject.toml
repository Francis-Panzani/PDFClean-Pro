[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfclean-pro"
version = "0.1.0"
description = "Professional PDF Header/Footer Cleaner"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name="Francis" }
]

license = { text = "MIT" }

dependencies = [
    "PyMuPDF>=1.25",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "pillow>=11.0",
    "numpy>=2.0"
]

[project.optional-dependencies]

dev = [
    "pytest>=8.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy"
]

[project.scripts]

pdfclean = "pdfclean.__main__:main"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]

testpaths = [
    "tests"
]