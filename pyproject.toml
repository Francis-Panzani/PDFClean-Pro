[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfclean-pro"
version = "0.1.0"
description = "Automatic header/footer remover for ENI PDF books"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Francis Panzani" }
]

dependencies = [
    "click>=8.1.8",
    "rich>=13.7.1",
    "PyMuPDF>=1.26.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10"
]

[project.scripts]
pdfclean = "pdfclean.__main__:main"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]